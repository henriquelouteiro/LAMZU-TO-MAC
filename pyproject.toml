[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lamzu-mac"
version = "0.1.0"
description = "Open configurator for LAMZU mice on macOS (port of the Windows Mouse Drive Beta)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = ["hidapi>=0.14"]

[project.optional-dependencies]
gui = ["PySide6>=6.6"]

[project.scripts]
lamzu = "lamzu_mac.cli:main"

[project.gui-scripts]
lamzu-gui = "lamzu_mac.gui.app:main"

[tool.setuptools]
packages = ["lamzu_mac", "lamzu_mac.gui"]

[tool.setuptools.package-data]
"lamzu_mac.gui" = ["assets/*.svg"]
